version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: graphguard-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: graphguard
    volumes:
      - graphguard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d graphguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: graphguard-redis
    ports:
      - "6379:6379"
    volumes:
      - graphguard-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  graphguard-pgdata:
  graphguard-redisdata:
